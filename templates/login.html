<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: radial-gradient(circle at top, #1e293b, #020617); color:white;">

<div class="container mt-5">

<div class="row justify-content-center align-items-center" style="height: 80vh;">

<div class="col-md-4">

<div class="card p-4 card-box">

<h3 class="text-center mb-4 fw-bold"> Login</h3>

<form method="POST">
    {% csrf_token %}

    <input class="form-control mb-3" name="username" placeholder="Username">

    <input class="form-control mb-3" type="password" name="password" placeholder="Password">

    <button class="btn btn-primary w-100">
         Login
    </button>
</form>

{% if error %}
<p class="text-danger mt-3 text-center">{{ error }}</p>
{% endif %}

<p class="text-center mt-3">
    Don't have account? 
    <a href="/register/" class="text-info">Register</a>
</p>

</div>

</div>

</div>

</div>

<style>
.card-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

.form-control {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
}

.form-control::placeholder {
    color: #cbd5e1;
}

.form-control:focus {
    background: rgba(255,255,255,0.12);
    color: white;
    box-shadow: none;
}
</style>

</body>
</html>
