{% extends 'base.html' %}
{% block content %}

<style>
.form-control {
    background: white;
    color: black;
    border: 1px solid #ccc;
}

.form-control::placeholder {
    color: gray;
}

.card-box {
    border-radius: 10px;
}
</style>

<div class="container mt-5">
    <h2 class="mb-4 fw-bold text-center">Create Account</h2>

    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card card-box p-4">

                {% if error %}
                <p style="color:red; text-align:center;">{{ error }}</p>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <input class="form-control mb-3" name="username" placeholder="Username" required>

                    <input class="form-control mb-3" name="email" placeholder="Email" required>

                    <input class="form-control mb-4" type="password" name="password" placeholder="Password" required>

                    <button class="btn btn-success w-100">
                        Register
                    </button>
                </form>

                <p class="text-center mt-3">
                    Already have account? 
                    <a href="/login/" class="text-info">Login</a>
                </p>

            </div>

        </div>
    </div>
</div>

{% endblock %}
