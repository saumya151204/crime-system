<!DOCTYPE html>
<html>
<head>
    <title>Crime Control System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background: #111827;
            color: white;
            padding: 20px;
            position: fixed;
            width: 220px;
        }

        .sidebar a {
            color: #ccc;
            display: block;
            padding: 10px;
            text-decoration: none;
            margin-bottom: 5px;
        }

        .sidebar a:hover {
            background: #1f2937;
            border-radius: 5px;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 20px;
        }

        .card-box {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4> Police Panel</h4>
    <hr>
    <a href="/dashboard/">Dashboard</a>
    <a href="/create/">Report Crime</a>
    <a href="/logout/">Logout</a>
</div>

<div class="main">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
