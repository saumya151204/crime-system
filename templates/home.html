<!DOCTYPE html>
<html>
<head>
    <title>Crime Reporting System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: white;
        }

        .navbar {
            background: transparent;
        }

        .hero {
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            animation: fadeIn 1.5s ease-in-out;
            font-size: 60px;
            font-weight: 800;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero span {
            color: #38bdf8;
        }

        .btn-custom {
            padding: 12px 25px;
            border-radius: 10px;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
        }

        .btn-outline-light:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand text-white fw-bold" href="/"> Crime System</a>

    <div class="ms-auto">
        <a href="/login/" class="btn btn-outline-light me-2">Login</a>
        <a href="/dashboard/" class="btn btn-primary">Get Started</a>
    </div>
</nav>

<!-- HERO SECTION -->
<div class="hero">

    <div>
        <h1>
            Report Crimes <br>
            <span>Safely & Securely</span>
        </h1>

        <p class="mt-3 text-light">
            A modern platform to report crimes anonymously and track status in real-time.
        </p>

        <div class="mt-4">
            <a href="/create/" class="btn btn-primary btn-custom me-2">
                 Create Report
            </a>

            <a href="/login/" class="btn btn-outline-light btn-custom">
                 Sign In
            </a>
        </div>
    </div>

</div>

</body>
</html>
